<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Buraco Família Mendonça</title>

    <style>

        .btn-gold { background-color: #f59e0b; color: #064e3b; font-weight: bold; transition: all 0.2s; }
        .btn-gold:hover { background-color: #d97706; transform: scale(1.02); }
        .hidden { display: none; }
        .menu-flutuante { position: absolute; right: 10px; top: 45px; background: #1a2e2a; border: 1px solid #f59e0b; border-radius: 8px; z-index: 100; min-width: 120px; }
        .card-hand { min-width: 45px; height: 70px; background: white; border-radius: 6px; color: black; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #ccc; font-weight: bold; }
    </style>
</head>
<body>
    <div id="app">
        <section id="view-auth" class="min-h-screen flex items-center justify-center p-6">

                </div>

            </div>
            
            <div class="grid gap-4">

                    <button onclick="changeView('view-ranking')" class="bg-blue-900/40 p-4 rounded-xl border border-white/10 flex flex-col items-center">
                        <span class="text-2xl mb-1">🏆</span>

                    </button>
                    <button onclick="changeView('view-torneios')" class="bg-purple-900/40 p-4 rounded-xl border border-white/10 flex flex-col items-center">

                        <div id="controles-d2" class="hidden flex gap-2 mt-1">
                            <button onclick="alterarPontos('d2_pontos', -10)" class="bg-red-900 px-2 rounded text-xs">-</button>
                            <button onclick="alterarPontos('d2_pontos', 10)" class="bg-green-900 px-2 rounded text-xs">+</button>
                        </div>
                    </div>
                </div>

                <button id="btn-encerrar-mesa" class="bg-red-600 text-white text-[10px] px-2 py-1 rounded hidden uppercase font-bold">Encerrar</button>
            </div>
            <div class="flex-1 flex flex-col items-center justify-center">

            </div>
            <div class="bg-black/40 p-4 border-t border-white/10 overflow-x-auto">
                <div id="mao-jogador" class="flex gap-1 justify-center"></div>
            </div>
        </section>

        <section id="view-treino" class="hidden min-h-screen p-6">
            <button onclick="changeView('view-menu')" class="mb-4">⬅️ Voltar</button>
            <h2 class="text-2xl font-bold text-green-400 mb-4">Sala de Treino</h2>
            <p class="text-gray-400">Pratique suas jogadas aqui.</p>
        </section>

        <section id="view-ranking" class="hidden min-h-screen p-6">
            <button onclick="changeView('view-menu')" class="mb-4">⬅️ Voltar</button>
            <h2 class="text-2xl font-bold text-blue-400 mb-4">Ranking</h2>
            <p class="text-gray-400">Em breve o ranking dos melhores da família.</p>
        </section>

        <section id="view-torneios" class="hidden min-h-screen p-6">
            <button onclick="changeView('view-menu')" class="mb-4">⬅️ Voltar</button>
            <h2 class="text-2xl font-bold text-purple-400 mb-4">Torneios</h2>
            <p class="text-gray-400">Participe dos torneios mensais.</p>
        </section>
    </div>

        window.addEventListener('load', async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('user-display').innerText = currentUser.email.split('@')[0];
                changeView('view-menu');
            } else {
                changeView('view-auth');
            }
        });

        function changeView(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // LÓGICA DE LOGIN/CADASTRO UNIFICADA
        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-title').innerText = isSignUpMode ? "Criar Conta" : "Buraco Mendonça";
            document.getElementById('btn-auth-principal').innerText = isSignUpMode ? "Cadastrar" : "Entrar";
            document.getElementById('auth-toggle-btn').innerText = isSignUpMode ? "Já tem conta? Entrar" : "Não tem conta? Cadastre-se";
        }

        async function authAction() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('pass').value;
            if (!email || !password) return alert("Preencha e-mail e senha.");

            if (isSignUpMode) {
                const { data, error } = await _supabase.auth.signUp({ email, password });
                if (error) alert("Erro: " + error.message);
                else alert("Cadastro realizado! Verifique seu e-mail ou faça login.");
            } else {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) alert("Erro: " + error.message);
                else {
                    currentUser = data.user;
                    document.getElementById('user-display').innerText = currentUser.email.split('@')[0];
                    changeView('view-menu');
                }
            }
        }

            await _supabase.auth.signOut();

        }
