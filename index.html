<div id="fluxo-jogo">
  
  <section id="tela-auth" class="bg-[#064e3b] min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#1a2e2a] p-8 rounded-2xl w-full max-w-sm text-center border border-white/10">
      <img src="coringa_icon.png" class="w-12 mx-auto mb-2">
      <h1 class="text-3xl font-bold text-yellow-500">Buraco</h1>
      <p class="text-white mb-6">Família Mendonça</p>
      <button onclick="logar()" class="bg-yellow-500 w-full py-3 rounded-xl font-bold">Entrar</button>
    </div>
  </section>

  <section id="tela-menu" class="hidden bg-[#064e3b] min-h-screen p-6">
    <div class="flex justify-between items-center text-yellow-500 mb-8">
      <span>Olá, Maxmüller</span>
      <button onclick="logout()">Logout</button>
    </div>
    <div class="space-y-4">
      <button onclick="irPara('tela-salas')" class="w-full bg-yellow-500 p-4 rounded-xl flex items-center gap-4 font-bold"><span class="icon">🎮</span> Jogar Online</button>
      <button onclick="irPara('tela-treino')" class="w-full bg-[#10b981] p-4 rounded-xl flex items-center gap-4 text-white font-bold"><span class="icon">🎓</span> Sala de Treino</button>
      <button onclick="irPara('tela-ranking')" class="w-full bg-[#10b981] p-4 rounded-xl flex items-center gap-4 text-white font-bold"><span class="icon">🏆</span> Ranking</button>
    </div>
  </section>

  <section id="tela-treino" class="hidden bg-[#064e3b] min-h-screen flex flex-col items-center justify-center p-6">
    <h2 class="text-yellow-500 text-2xl font-bold mb-4">Sala de Treino</h2>
    <p class="text-white text-center mb-8">Pratique contra bots e domine as estratégias!</p>
    <button onclick="iniciarJogo(true)" class="bg-yellow-500 px-12 py-4 rounded-xl font-bold mb-4">Iniciar Treino</button>
  </section>

</div>
