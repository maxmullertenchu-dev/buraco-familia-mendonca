<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buraco Família Mendonça</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #064e3b; color: white; font-family: sans-serif; overflow-x: hidden; }
        .bg-card-dark { background-color: #1a2e2a; border: 1px solid rgba(255,255,255,0.1); }
        .btn-gold { background-color: #f59e0b; color: #064e3b; font-weight: bold; transition: all 0.2s; }
        .btn-gold:hover { background-color: #d97706; transform: scale(1.02); }
        .hidden { display: none; }
        .card-hand { min-width: 50px; height: 75px; background: white; border-radius: 6px; color: black; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div id="app">
        <section id="view-auth" class="min-h-screen flex items-center justify-center p-6">
            <div class="bg-card-dark p-8 rounded-2xl w-full max-w-sm text-center shadow-2xl">
                <div class="text-5xl mb-2">🃏</div>
                <h1 id="auth-title" class="text-3xl font-bold text-yellow-500">Buraco</h1>
                <p class="text-gray-300 mb-6 text-sm">Família Mendonça</p>
                <div class="space-y-4">
                    <input type="email" id="email" placeholder="E-mail" class="w-full p-3 rounded-lg bg-black/20 border border-white/10 text-white outline-none">
                    <input type="password" id="pass" placeholder="Senha" class="w-full p-3 rounded-lg bg-black/20 border border-white/10 text-white outline-none">
                    <button id="btn-principal" onclick="handleLogin()" class="btn-gold w-full py-3 rounded-lg text-lg">Entrar</button>
                    <button id="auth-toggle-btn" onclick="toggleAuthMode()" class="text-gray-400 text-sm hover:text-white underline">Não tem conta? Cadastre-se</button>
                </div>
            </div>
        </section>

        <section id="view-menu" class="hidden min-h-screen p-6">
            <div class="flex justify-between items-center mb-8 bg-black/20 p-4 rounded-xl">
                <div>
                    <p class="text-yellow-500 font-bold">Olá, <span id="user-display">Jogador</span></p>
                    <p class="text-[10px] text-gray-400">Bem-vindo à mesa!</p>
                </div>
                <button onclick="logout()" class="bg-red-900/50 p-2 rounded-lg text-xl">🚪</button>
            </div>
            <div class="grid gap-4">
                <button onclick="abrirSalas()" class="btn-gold w-full p-5 rounded-xl flex items-center justify-between">
                    <span class="flex items-center gap-4 text-lg"><span>🎮</span> Jogar Online</span>
                    <span>❯</span>
                </button>
                <button onclick="changeView('view-treino')" class="w-full bg-[#10b981] p-5 rounded-xl flex items-center justify-between font-bold">
                    <span class="flex items-center gap-4 text-lg"><span>🎓</span> Sala de Treino</span>
                    <span>❯</span>
                </button>
            </div>
        </section>

        <section id="view-salas" class="hidden min-h-screen p-6">
            <div class="flex items-center justify-between mb-6">
                <button onclick="changeView('view-menu')" class="text-2xl">⬅️</button>
                <h2 class="text-2xl font-bold text-yellow-500">Salas de Jogo</h2>
                <button onclick="criarNovaSala()" class="bg-yellow-500 text-black px-4 py-2 rounded-full font-extrabold shadow-lg">+</button>
            </div>
            <div id="lista-salas" class="space-y-4">
                <p id="sem-salas" class="text-center text-gray-500 mt-10">Nenhuma sala criada. Clique no + para começar!</p>
            </div>
        </section>

        <section id="view-mesa" class="hidden fixed inset-0 bg-[#064e3b] z-50 flex flex-col">
            <div class="p-4 flex justify-between items-center bg-black/20">
                <button id="btn-fechar-sala" class="bg-red-600 text-white text-[10px] px-3 py-1 rounded hidden">ENCERRAR SALA</button>
                <button onclick="changeView('view-salas')" class="text-white text-[10px] border border-white/20 px-2 py-1 rounded">SAIR</button>
                <div class="text-center"><p class="text-red-500 font-bold">90s</p></div>
                <div class="text-[10px] text-right"><p>D1: 0 | D2: 0</p></div>
            </div>
            <div class="flex-1 flex items-center justify-center">
                <div class="w-16 h-24 bg-blue-800 rounded-lg border-2 border-white flex items-center justify-center shadow-2xl">🎴</div>
            </div>
            <div class="bg-black/40 p-4 rounded-t-3xl border-t border-white/10">
                <div id="mao-jogador" class="flex gap-1 overflow-x-auto pb-4"></div>
            </div>
        </section>
    </div>

    <script>
        const supabaseUrl = 'https://bynafmrslfrsmeemcski.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5bmFmbXJzbGZyc21lZW1jc2tpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3ODM2OTgsImV4cCI6MjA4MzM1OTY5OH0.GDenWT1Cnunty2B6TWQdlUsDTQMY-6RMFBokbJCUySw'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;

        function changeView(viewId) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        async function abrirSalas() {
            changeView('view-salas');
            carregarSalas();
        }

        async function carregarSalas() {
            const { data: salas, error } = await _supabase.from('salas').select('*');
            const container = document.getElementById('lista-salas');
            const semSalas = document.getElementById('sem-salas');
            
            container.innerHTML = '';
            if (salas && salas.length > 0) {
                semSalas.classList.add('hidden');
                salas.forEach(sala => {
                    container.innerHTML += `
                        <div class="bg-card-dark p-6 rounded-2xl border-l-4 border-yellow-500 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-white">${sala.nome}</h3>
                                <p class="text-[10px] text-gray-400">Por: ${sala.criador_nome}</p>
                            </div>
                            <button onclick="entrarNaMesa('${sala.id}', '${sala.criador_id}')" class="btn-gold px-4 py-2 rounded-lg text-xs">JOGAR</button>
                        </div>`;
                });
            } else {
                semSalas.classList.remove('hidden');
            }
        }

        async function criarNovaSala() {
            const nomeSala = prompt("Nome da Sala:", "Mesa Mendonça");
            if (!nomeSala) return;

            const { data, error } = await _supabase.from('salas').insert([
                { nome: nomeSala, criador_id: currentUser.id, criador_nome: currentUser.email.split('@')[0] }
            ]);

            if (error) alert("Erro ao criar sala. Verifique se a tabela 'salas' existe no Supabase.");
            else carregarSalas();
        }

        function entrarNaMesa(salaId, criadorId) {
            changeView('view-mesa');
            const btnFechar = document.getElementById('btn-fechar-sala');
            
            // Só mostra botão de encerrar se for o criador
            if (currentUser.id === criadorId) {
                btnFechar.classList.remove('hidden');
                btnFechar.onclick = () => fecharSala(salaId);
            } else {
                btnFechar.classList.add('hidden');
            }
            renderizarMao();
        }

        async function fecharSala(salaId) {
            if (confirm("Deseja realmente encerrar esta sala?")) {
                const { error } = await _supabase.from('salas').delete().eq('id', salaId);
                if (error) alert("Erro ao fechar");
                else abrirSalas();
            }
        }

        function renderizarMao() {
            const mao = document.getElementById('mao-jogador');
            mao.innerHTML = '';
            for(let i=0; i<11; i++) {
                mao.innerHTML += `<div class="card-hand"><span class="text-xs font-bold">A</span><span class="text-xl text-red-600">♥️</span></div>`;
            }
        }

        // Funções de Auth permanecem as mesmas
        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else {
                currentUser = data.user;
                document.getElementById('user-display').innerText = currentUser.email.split('@')[0];
                changeView('view-menu');
            }
        }

        function toggleAuthMode() { /* lógica de troca de texto */ }
        async function logout() { await _supabase.auth.signOut(); changeView('view-auth'); }
    </script>
</body>
</html>
