<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buraco Família Mendonça</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #064e3b; color: white; font-family: sans-serif; overflow-x: hidden; }
        .bg-card-dark { background-color: #1a2e2a; border: 1px solid rgba(255,255,255,0.1); }
        .btn-gold { background-color: #f59e0b; color: #064e3b; font-weight: bold; }
        .hidden { display: none; }
        .menu-flutuante { position: absolute; right: 10px; top: 45px; background: #1a2e2a; border: 1px solid #f59e0b; border-radius: 8px; z-index: 100; min-width: 120px; }
    </style>
</head>
<body>
    <div id="app">
        <section id="view-auth" class="min-h-screen flex items-center justify-center p-6">
            <div class="bg-card-dark p-8 rounded-2xl w-full max-w-sm text-center shadow-2xl">
                <h1 class="text-3xl font-bold text-yellow-500 mb-6">Buraco Mendonça</h1>
                <input type="email" id="email" placeholder="E-mail" class="w-full p-3 mb-4 rounded bg-black/20 border border-white/10 outline-none">
                <input type="password" id="pass" placeholder="Senha" class="w-full p-3 mb-6 rounded bg-black/20 border border-white/10 outline-none">
                <button onclick="handleLogin()" class="btn-gold w-full py-3 rounded-lg">Entrar</button>
            </div>
        </section>

        <section id="view-menu" class="hidden min-h-screen p-6">
            <div class="flex justify-between items-center mb-8 bg-black/20 p-4 rounded-xl">
                <p class="text-yellow-500 font-bold">Olá, <span id="user-display">Jogador</span></p>
                <button onclick="logout()" class="text-xl">🚪</button>
            </div>
            <button onclick="abrirSalas()" class="btn-gold w-full p-5 rounded-xl flex justify-between text-lg">
                <span>🎮 Jogar Online</span> <span>❯</span>
            </button>
        </section>

        <section id="view-salas" class="hidden min-h-screen p-6">
            <div class="flex items-center justify-between mb-6">
                <button onclick="changeView('view-menu')" class="text-2xl">⬅️</button>
                <h2 class="text-2xl font-bold text-yellow-500">Lobby</h2>
                <button onclick="criarNovaSala()" class="bg-yellow-500 text-black px-4 py-2 rounded-full font-bold">+</button>
            </div>
            <div id="lista-salas" class="space-y-4"></div>
        </section>

        <section id="view-mesa" class="hidden fixed inset-0 bg-[#064e3b] z-50 flex flex-col">
            <div class="p-4 flex justify-between items-center bg-black/20">
                <button onclick="changeView('view-salas')" class="text-xs border border-white/20 px-2 py-1 rounded">VOLTAR</button>
                <h2 id="nome-sala-ativa" class="font-bold text-yellow-500">Mesa</h2>
                <button id="btn-encerrar-mesa" class="bg-red-600 text-white text-[10px] px-2 py-1 rounded hidden">ENCERRAR</button>
            </div>
            <div class="flex-1 flex items-center justify-center">🎴</div>
        </section>
    </div>

    <script>
        const supabaseUrl = 'https://bynafmrslfrsmeemcski.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5bmFmbXJzbGZyc21lZW1jc2tpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3ODM2OTgsImV4cCI6MjA4MzM1OTY5OH0.GDenWT1Cnunty2B6TWQdlUsDTQMY-6RMFBokbJCUySw'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;

        // LOGIN PERSISTENTE
        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('user-display').innerText = currentUser.email.split('@')[0];
                changeView('view-menu');
            }
        };

        function changeView(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        async function abrirSalas() {
            changeView('view-salas');
            carregarSalas();
            
            // ESCUTA O BANCO EM TEMPO REAL
            _supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'salas' }, () => {
                carregarSalas();
            }).subscribe();
        }

        async function carregarSalas() {
            const { data: salas } = await _supabase.from('salas').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('lista-salas');
            container.innerHTML = '';
            
            salas.forEach(sala => {
                const souDono = currentUser && currentUser.id === sala.criador_id;
                container.innerHTML += `
                    <div class="bg-card-dark p-4 rounded-xl flex justify-between items-center relative border border-white/5">
                        <div onclick="entrarNaMesa('${sala.id}', '${sala.nome}', '${sala.criador_id}')" class="flex-1 cursor-pointer">
                            <p class="font-bold text-white">${sala.nome}</p>
                            <p class="text-[10px] text-gray-400">Dono: ${sala.criador_nome}</p>
                        </div>
                        ${souDono ? `
                            <button onclick="event.stopPropagation(); abrirMenu('${sala.id}')" class="p-2">⋮</button>
                            <div id="menu-${sala.id}" class="hidden menu-flutuante shadow-2xl">
                                <button onclick="editarNome('${sala.id}', '${sala.nome}')" class="w-full text-left p-3 text-xs border-b border-white/5">✏️ Editar</button>
                                <button onclick="fecharSala('${sala.id}')" class="w-full text-left p-3 text-xs text-red-500">🗑️ Encerrar</button>
                            </div>
                        ` : ''}
                    </div>`;
            });
        }

        async function criarNovaSala() {
            const n = prompt("Nome da Sala:");
            if (!n) return;
            const { error } = await _supabase.from('salas').insert([{ nome: n, criador_id: currentUser.id, criador_nome: currentUser.email.split('@')[0] }]);
            if (error && error.code === '23505') alert("Nome já existe!");
        }

        function abrirMenu(id) {
            document.querySelectorAll('.menu-flutuante').forEach(m => m.id !== `menu-${id}` && m.classList.add('hidden'));
            document.getElementById(`menu-${id}`).classList.toggle('hidden');
        }

        async function editarNome(id, nomeVelho) {
            const n = prompt("Novo nome:", nomeVelho);
            if (n) await _supabase.from('salas').update({ nome: n }).eq('id', id);
        }

        async function fecharSala(id) {
            if (confirm("Encerrar sala?")) {
                await _supabase.from('salas').delete().eq('id', id);
                changeView('view-salas');
            }
        }

        function entrarNaMesa(id, nome, criadorId) {
            changeView('view-mesa');
            document.getElementById('nome-sala-ativa').innerText = nome;
            const btn = document.getElementById('btn-encerrar-mesa');
            if (currentUser.id === criadorId) {
                btn.classList.remove('hidden');
                btn.onclick = () => fecharSala(id);
            } else {
                btn.classList.add('hidden');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else location.reload();
        }

        async function logout() { await _supabase.auth.signOut(); location.reload(); }
    </script>
</body>
</html>
